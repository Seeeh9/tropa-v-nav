[workspace]
resolver = "2"
members = ["crates/core", "crates/net", "crates/game"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# bevy_audio with an output that can be reopened on the default device (see patches/bevy_audio)
[patch.crates-io]
bevy_audio = { path = "patches/bevy_audio" }
